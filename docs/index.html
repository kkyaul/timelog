<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>timelog</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── SVG ICON DEFS ─────────────────────────────────────────────────────── -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ico-sleep" viewBox="0 0 20 20" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15.5 13.5A7 7 0 0 1 6.5 4.5a7 7 0 1 0 9 9z"/>
  </symbol>
  <symbol id="ico-work" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.5" y="5" width="13" height="9" rx="1.5"/>
    <path d="M5.5 5V3.5A1.5 1.5 0 0 1 7 2h2a1.5 1.5 0 0 1 1.5 1.5V5"/>
    <line x1="1.5" y1="9" x2="14.5" y2="9"/>
  </symbol>
  <symbol id="ico-english" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 13L8 3l5 10"/>
    <line x1="5.2" y1="9" x2="10.8" y2="9"/>
  </symbol>
  <symbol id="ico-violin" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="3" x2="6" y2="10"/>
    <line x1="10" y1="2" x2="10" y2="8"/>
    <line x1="6" y1="3" x2="10" y2="2"/>
    <circle cx="5" cy="11" r="1.5"/>
    <circle cx="9" cy="9.5" r="1.5"/>
  </symbol>
  <symbol id="ico-reading" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 13V4"/>
    <path d="M2 4c1.5 0 4 .5 6 2 2-1.5 4.5-2 6-2v9c-1.5 0-4 .5-6 2-2-1.5-4.5-2-6-2V4z"/>
  </symbol>
  <symbol id="ico-exercise" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="9.5,2 5,9 8.5,9 6.5,14 12,7 8,7 9.5,2"/>
  </symbol>
  <symbol id="ico-waste" viewBox="0 0 16 16" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3,4 13,4"/>
    <path d="M5 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/>
    <path d="M4.5 4l.8 9a1 1 0 0 0 1 .9h3.4a1 1 0 0 0 1-.9l.8-9"/>
    <line x1="6.5" y1="7" x2="6.5" y2="11"/>
    <line x1="9.5" y1="7" x2="9.5" y2="11"/>
  </symbol>
</svg>

<!-- ════════════════════════════════════════════════════════════════════════
     LOGIN SCREEN
════════════════════════════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-title">~/timelog</div>
    <div class="login-prompt">
      <span class="ps">$</span>
      <span class="pc">auth --provider=google</span>
      <span class="cur"></span>
    </div>
    <div class="login-desc">// Google 계정으로 로그인이 필요합니다</div>
    <button id="btn-login" class="login-btn">▶ sign in with google</button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════════════
     APP SCREEN
════════════════════════════════════════════════════════════════════════ -->
<div id="app-screen" class="hidden">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="tl">
      <div class="dots">
        <div class="dot r"></div>
        <div class="dot y"></div>
        <div class="dot g"></div>
      </div>
      <div class="tt">~/timelog</div>
    </div>
    <button id="btn-signout" class="signout-btn">[ exit ]</button>
  </div>

  <!-- ── LIST VIEW ───────────────────────────────────────────────────── -->
  <div class="view active" id="v-list">
    <div class="prompt">
      <span class="ps">$</span>
      <span class="pc">cat time.log</span>
      <span class="cur"></span>
    </div>

    <!-- 아이콘 범례 -->
    <div class="legend-row">
      <span class="legend-item"><svg class="icon" style="stroke:var(--sleep)"><use href="#ico-sleep"/></svg>sleep</span>
      <span class="legend-item"><svg class="icon" style="stroke:var(--work)"><use href="#ico-work"/></svg>work</span>
      <span class="legend-item"><svg class="icon" style="stroke:var(--english)"><use href="#ico-english"/></svg>english</span>
      <span class="legend-item"><svg class="icon" style="stroke:var(--violin)"><use href="#ico-violin"/></svg>violin</span>
      <span class="legend-item"><svg class="icon" style="stroke:var(--reading)"><use href="#ico-reading"/></svg>reading</span>
      <span class="legend-item"><svg class="icon" style="stroke:var(--exercise)"><use href="#ico-exercise"/></svg>exercise</span>
      <span class="legend-item"><svg class="icon" style="stroke:var(--waste)"><use href="#ico-waste"/></svg>waste</span>
    </div>

    <div id="list-body"></div>
  </div>

  <!-- ── DETAIL VIEW ─────────────────────────────────────────────────── -->
  <div class="view" id="v-detail">
    <div class="back-row">
      <button id="btn-back" class="bb">← back</button>
      <span id="d-date" class="d-date"></span>
      <span id="d-wk"   class="d-wk"></span>
    </div>
    <div class="prompt">
      <span class="ps">$</span>
      <span id="d-cmd" class="pc"></span>
    </div>
    <div id="detail-body"></div>
    <div class="d-actions">
      <button id="btn-sync-detail" class="abt p">▶ sync calendar</button>
      <button class="abt" onclick="document.getElementById('btn-sync-detail').click()">[ save ]</button>
    </div>
  </div>

  <!-- ── STAT VIEW ───────────────────────────────────────────────────── -->
  <div class="view" id="v-stat">
    <div class="prompt">
      <span class="ps">$</span>
      <span class="pc">stats --report</span>
      <span class="cur"></span>
    </div>

    <!-- 모드 탭 -->
    <div class="fr">
      <button class="fb" data-mode="year">year</button>
      <button class="fb" data-mode="month">month</button>
      <button class="fb on" data-mode="week">week</button>
    </div>

    <!-- year 선택기 -->
    <div class="stat-selector hidden" id="sel-year">
      <div class="sel-label">// year</div>
      <div class="sel-row">
        <button class="sel-btn" id="year-prev">&#x2039;</button>
        <select id="sel-year-val" class="sel-select"></select>
        <button class="sel-btn" id="year-next">&#x203a;</button>
      </div>
    </div>

    <!-- month 선택기 -->
    <div class="stat-selector hidden" id="sel-month">
      <div class="sel-label">// year &middot; month</div>
      <div class="sel-row">
        <select id="sel-month-year" class="sel-select sel-select-sm"></select>
        <span class="sel-sep">&middot;</span>
        <select id="sel-month-val" class="sel-select">
          <option value="1">01</option><option value="2">02</option>
          <option value="3">03</option><option value="4">04</option>
          <option value="5">05</option><option value="6">06</option>
          <option value="7">07</option><option value="8">08</option>
          <option value="9">09</option><option value="10">10</option>
          <option value="11">11</option><option value="12">12</option>
        </select>
      </div>
    </div>

    <!-- week 선택기 -->
    <div class="stat-selector hidden" id="sel-week">
      <div class="sel-label">// year &middot; week</div>
      <div class="sel-row">
        <select id="sel-week-year" class="sel-select sel-select-sm"></select>
        <span class="sel-sep">&middot;</span>
        <select id="sel-week-val" class="sel-select"></select>
      </div>
    </div>

    <div id="stat-body"></div>
  </div>

  <!-- ── SYNC VIEW ───────────────────────────────────────────────────── -->
  <div class="view" id="v-sync">
    <div class="prompt">
      <span class="ps">$</span>
      <span class="pc">sync --date=<span class="cur"></span></span>
    </div>
    <div class="sec">특정 날짜 캘린더 재조회</div>

    <div class="sync-form">
      <div class="sync-label">// target date</div>
      <div class="sync-input-row">
        <input id="sync-date-input" class="sync-input" type="date">
        <button id="btn-do-sync" class="sync-btn">▶ sync</button>
      </div>
    </div>

    <div id="sync-result" class="sync-result"></div>

    <div class="sync-hist-wrap">
      <div class="sec" style="padding:0;border:none;margin-bottom:8px;">// recent syncs</div>
      <div id="sync-history" class="sync-history"></div>
    </div>
  </div>

  <!-- NAV -->
  <nav class="nav">
    <button class="nb on" data-view="list"><span class="tilde">~/</span>log</button>
    <button class="nb" data-view="stat"><span class="tilde">~/</span>stat</button>
    <button class="nb" data-view="sync"><span class="tilde">~/</span>sync</button>
  </nav>

</div><!-- /app-screen -->

<!-- ── EDIT MODAL ─────────────────────────────────────────────────────── -->
<div id="edit-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">
      <span class="ps">$</span>
      <span class="pc">edit <span id="edit-field-label"></span></span>
    </div>
    <div class="modal-date" id="edit-date-label"></div>
    <div class="modal-input-wrap">
      <input id="edit-input" class="modal-input" type="text" placeholder="H:MM" maxlength="5">
      <span class="modal-hint">// H:MM 형식 (예: 7:30)</span>
    </div>
    <div class="modal-actions">
      <button id="edit-confirm" class="abt p">[ save ]</button>
      <button id="edit-cancel"  class="abt">[ cancel ]</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- Firebase SDK (CDN) -->
<script type="module" src="js/app.js"></script>
<script type="module" src="js/ui.js"></script>
</body>
</html>
